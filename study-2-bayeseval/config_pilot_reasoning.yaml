# Pilot: measure output lengths when responses include a Reasoning field,
# before committing to a full re-run (see docs/lifeeval-history.md §7).
# 50 randomly sampled questions (seed 42) per domain × 4 models = 400 calls.
# WGD is excluded: its encoded photos are gitignored and not present in this
# worktree. Summarize results with:
#   python -m src.features.pilot_summary

domains:
  - name: LifeEval
    reasoning: true
  - name: MedEval
    benchmark_file: benchmark_combined.csv
    reasoning: true

models:
  - google/gemini-2.5-flash
  - openai/gpt-5.4-mini
  - anthropic/claude-haiku-4.5
  - meta-llama/llama-4-maverick

mode: batch
concurrency: 12
max_questions: null
sample_questions: 50        # random sample (seed 42) instead of head()
output_dir: results_pilot_reasoning

openrouter:
  api_key_env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  timeout_s: 60
  max_retries: 3
